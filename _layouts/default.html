<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<!-- Adapted from https://github.com/luost26/academic-homepage (MIT). -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title | escape }} · Generative AI & Visual Computing">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/research/pride.webp' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
  <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include navbar.html %}
  <main class="container-lg" id="main">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
