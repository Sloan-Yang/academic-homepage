short_bio: >-
  <p>I am an M.S. student in Computer Science at <a href="https://www.shanghaitech.edu.cn/eng/">ShanghaiTech University</a>,
  advised by <a href="https://www.ying-cao.com/">Ying Cao</a> and
  <a href="https://faculty.sist.shanghaitech.edu.cn/liquan/">Quan Li</a>. My research focuses on
  generative models for graphic design and multimodal understanding.</p>
  <p>I develop generative models that jointly reason about visual content, spatial layout,
  typography, and semantic intent. My recent work explores multimodal priors for data-efficient
  design generation, interactions between image and layout generation, and coordinated image
  editing and layout synthesis. More broadly, I am interested in controllable generation,
  multimodal learning, and diffusion- and flow-based generative modeling.</p>
  <p>Beyond research, I enjoy drawing and long-distance running.</p>
