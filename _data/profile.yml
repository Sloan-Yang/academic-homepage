short_bio: >-
  <p>I am an MPhil student at <a href="https://www.shanghaitech.edu.cn/eng/">ShanghaiTech University</a>,
  working on generative models for graphic design and structured visual generation.</p>
  <p>My research studies how imagery, spatial layout, typography, and semantic intent can be
  generated and edited together. I am particularly interested in using pretrained multimodal
  priors to produce coherent designs that remain editable.</p>
  <p>My broader interests include 2D/3D generation, vector and SVG graphics, world models,
  and diffusion- and flow-based generative modeling. Outside research, I enjoy drawing and
  building interactive systems with Unity, Unreal, and Bevy.</p>
