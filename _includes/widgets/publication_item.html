{% assign item = include.item %}
<article class="publication-item" aria-labelledby="title-{{ item.slug }}">
  <a class="publication-cover" href="{{ item.project_url }}" aria-label="{{ item.short_name }} project page">
    <img src="{{ item.cover | relative_url }}" alt="{{ item.cover_alt | escape }}" width="{{ item.cover_width }}" height="{{ item.cover_height }}" loading="lazy" decoding="async">
  </a>
  <div class="publication-body">
    <h3 id="title-{{ item.slug }}"><a href="{{ item.project_url }}">{{ item.title }}</a></h3>
    <p class="publication-authors">{% include widgets/author_list.html authors=item.authors %}</p>
    <p class="publication-venue">{{ item.venue }} · {{ item.year }} <span class="review-status">Under review</span></p>
    <p class="publication-abstract">{{ item.abstract }}</p>
    <div class="publication-links" aria-label="{{ item.short_name }} links">
      <a href="{{ item.project_url }}">Project page</a>
      {% for link in item.links %}<a href="{{ link[1] }}">{{ link[0] }}</a>{% endfor %}
    </div>
  </div>
</article>
